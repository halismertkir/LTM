name: Apple

# Builds the Swift package and both apps on a macOS runner. Unsigned simulator builds:
# this proves the sources compile and the unit tests pass; running on a device still
# needs your own signing identity (see apps/apple/README.md).

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/apple/**"
      - "packages/protocol/consent/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apps/apple/**"
      - "packages/protocol/consent/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: LTMKit tests (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        working-directory: apps/apple/LTMKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/kit.log" | grep -E "error|warning: var|failed|passed|Executed|Build complete|Compiling" | tail -n 300

  apps:
    name: iOS and watchOS apps (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodebuild -version
      - name: Generate the Xcode project
        working-directory: apps/apple
        run: xcodegen generate
      - name: Build the watch app
        working-directory: apps/apple
        run: |
          xcodebuild -project LTM.xcodeproj -scheme LTMWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/watch.log" 2>&1 \
            || { grep -E "error:|error -|fatal" "$RUNNER_TEMP/watch.log" | sort -u | head -n 250; tail -n 25 "$RUNNER_TEMP/watch.log"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/watch.log"
      - name: Build the iPhone app (embeds the watch app)
        if: always()
        working-directory: apps/apple
        run: |
          xcodebuild -project LTM.xcodeproj -scheme LTMiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/ios.log" 2>&1 \
            || { grep -E "error:|error -|fatal" "$RUNNER_TEMP/ios.log" | sort -u | head -n 250; tail -n 25 "$RUNNER_TEMP/ios.log"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/ios.log"
