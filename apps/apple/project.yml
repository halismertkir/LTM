# XcodeGen spec for the LTM iPhone and Apple Watch apps.
#   brew install xcodegen && cd apps/apple && xcodegen generate
# The generated LTM.xcodeproj is git-ignored; this file is the source of truth.
name: LTM

options:
  bundleIdPrefix: app.ltm
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    # Swift 5 language mode (built with the Swift 5.10 compiler of Xcode 15.3+ or newer).
    SWIFT_VERSION: "5.0"
    # Set your own team here or in Xcode (Signing & Capabilities). Left empty on purpose.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Placeholder bundle identifier; the watch app id is derived from it.
    LTM_IOS_BUNDLE_ID: app.ltm.ios
    GENERATE_INFOPLIST_FILE: NO

packages:
  LTMKit:
    path: LTMKit

targets:
  LTMiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LTMiOS/Sources
      - path: LTMiOS/Resources
        buildPhase: resources
      # The canonical consent documents and notice templates, bundled as-is (never copied
      # into this directory, never re-typed): decoded at runtime by ConsentCatalog.
      - path: ../../packages/protocol/consent/consent.v1.json
        buildPhase: resources
    dependencies:
      - package: LTMKit
      - target: LTMWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_NAME: LTM
        PRODUCT_BUNDLE_IDENTIFIER: $(LTM_IOS_BUNDLE_ID)
        INFOPLIST_FILE: LTMiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: LTMiOS/LTMiOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  LTMWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LTMWatch/Sources
      - path: LTMWatch/Resources
        buildPhase: resources
      - path: ../../packages/protocol/consent/consent.v1.json
        buildPhase: resources
    dependencies:
      - package: LTMKit
    settings:
      base:
        PRODUCT_NAME: LTMWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(LTM_IOS_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: LTMWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: LTMWatch/LTMWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        # Embedded in the iPhone app; not installed on its own.
        SKIP_INSTALL: YES

schemes:
  LTMiOS:
    build:
      targets:
        LTMiOS: all
        LTMWatch: all
    run:
      config: Debug
    archive:
      config: Release
  LTMWatch:
    build:
      targets:
        LTMWatch: all
    run:
      config: Debug
