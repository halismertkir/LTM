<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LTM — offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --paper: #f5f1e8; --card: #fffdf8; --ink: #26231f; --ink-2: #5d564c; --accent: #2f5f57; --line: #e4dccd; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #191714; --card: #23201c; --ink: #ece6da; --ink-2: #b6ad9e; --accent: #86bdae; --line: #35312b; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
        background: var(--paper); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
      h1 { font: 600 1.5rem/1.25 "Iowan Old Style", Charter, Georgia, serif; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 0.75rem; color: var(--ink-2); }
      a { display: inline-block; margin-top: 0.5rem; padding: 0.55rem 1rem; border-radius: 7px;
        background: var(--accent); color: var(--paper); text-decoration: none; font-weight: 600; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 1.25rem 0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="48" height="48" alt="" />
      <h1>You are offline</h1>
      <p>LTM needs a connection to your server to show your memory. Nothing is stored on this device.</p>
      <hr />
      <h1 lang="tr">Çevrimdışısınız</h1>
      <p lang="tr">LTM'nin belleğinizi gösterebilmesi için sunucunuza bağlanması gerekir. Bu cihazda hiçbir şey saklanmaz.</p>
      <a href="/">Try again · Tekrar dene</a>
    </main>
  </body>
</html>
