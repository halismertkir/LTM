# LTM self-hosting stack.
#
#   docker compose up -d                       → LTM with its embedded database
#   docker compose --profile postgres up -d    → LTM + PostgreSQL/pgvector (set DATABASE_URL in .env)
#   docker compose --profile local-ai up -d    → adds Ollama (LLM, embeddings) and Speaches (Whisper)
#   … -f docker-compose.yml -f docker-compose.gpu.yml --profile local-ai up -d   → the same on an NVIDIA GPU
#
# Copy .env.example to .env first. Put a TLS-terminating reverse proxy in front before
# exposing this beyond your own machine — see docs/SELF_HOSTING.md.

services:
  ltm:
    build: .
    image: ltm:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LTM_DATA_DIR: /data
    ports:
      - "127.0.0.1:${LTM_PORT:-8080}:8080"
    volumes:
      - ltm-data:/data
    # Only takes effect with the postgres profile: wait for the database to accept connections.
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: [postgres]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ltm
      POSTGRES_DB: ltm
      # Required for this profile; the database refuses to initialise with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ltm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltm -d ltm"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    profiles: [local-ai]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # For an NVIDIA graphics card add docker-compose.gpu.yml (see that file).

  speaches:
    profiles: [local-ai]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  ltm-data:
  ltm-postgres:
  ollama-models:
  speaches-models:
